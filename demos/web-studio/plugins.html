<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Efectos y estilo · Web Studio</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { margin: 0; background: var(--fondo, #121316); color: var(--texto, #eee); font-family: var(--font, system-ui); }
  header { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--borde-suave, #333); align-items: center; }
  header button { background: var(--panel3, #333); color: inherit; border: 1px solid var(--borde, #444); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  header button.on { background: var(--acento, #F5B82E); color: var(--on-ac, #111); }
  main { padding: 12px 16px; }
</style>
</head>
<body>
<!-- Página independiente (pruebas y acceso directo): el editor monta los mismos módulos con WDVS.plugins / WDVS.estilo. -->
<header><b>Web Studio</b>
  <button id="b1" class="on">Efectos y transiciones</button><button id="b2">Código (Avanzado)</button><button id="b3">Mi estilo</button></header>
<main id="m"></main>
<script src="plugins_panel.js"></script>
<script src="estilo_panel.js"></script>
<script>
  const m = document.getElementById("m");
  const tabs = { b1: () => WDVS.plugins.montarPanel(m), b2: () => WDVS.plugins.montarEditor(m, {}), b3: () => WDVS.estilo.montar(m) };
  for (const [id, fn] of Object.entries(tabs)) document.getElementById(id).onclick = (e) => {
    document.querySelectorAll("header button").forEach((b) => b.classList.toggle("on", b === e.target)); fn(); };
  const q = new URLSearchParams(location.search).get("tab");
  (q && document.getElementById(q) ? document.getElementById(q) : document.getElementById("b1")).click();
</script>
</body>
</html>
